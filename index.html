<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>City Clinic Token Display</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #1a2a40; /* Fallback base tone */
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

    /* Vibrant, animated background gradient */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(-45deg, #0f766e, #0e7490, #1e3a8a, #312e81);
      background-size: 400% 400%;
      animation: gradientFlow 16s ease infinite;
      z-index: -3;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating bubbles canvas positioned right above background */
    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .container {
      display: flex;
      height: calc(100% - 140px);
      width: 100vw;
      position: relative;
      z-index: 1;
    }

    /* LEFT: Video Area */
    .left {
      position: relative;
      width: 68.6%;
      height: 100%;
      background: #000;
      display: flex;
    }

    #ytVideo {
      width: 100%;
      height: 100%;
      border: none; 
      border-bottom-right-radius: 16px;
    }

    /* RIGHT: Token Display Area (transparent so gradient & bubbles show through) */
    .right {
      width: 31.4%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      padding: 15px 10px;
      box-sizing: border-box;
      background: transparent;
    }

    .right img {
      width: 290px;
      max-width: 90%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
    }

    .token-label {
      font-size: 58px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .token-number {
      font-size: 260px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 30px #00ffff, 0 4px 10px rgba(0,0,0,0.5);
      line-height: 0.95;
      margin: 0;
    }

    .token-number.blink {
      animation: blink 0.6s ease-in-out 3;
    }

    .token-text { 
      font-size: 58px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 1ST BOTTOM BAR: Time/Date + Dynamic Notice */
    .full-ticker-bar {
      position: fixed;
      bottom: 48px;
      left: 0;
      width: 100vw;
      height: 92px;
      display: flex;
      align-items: stretch;
      background: rgba(10, 15, 25, 0.75);
      border-top: 2px solid rgba(255, 255, 255, 0.2);
      z-index: 5;
      backdrop-filter: blur(4px);
    }

    .time-date-box {
      width: 12%;
      min-width: 220px;
      background: rgba(5, 10, 20, 0.92);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 2px solid rgba(255, 255, 255, 0.25);
      padding: 0 12px;
    }

    .clock-time {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.1;
      color: #00f2fe;
      text-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
    }

    .clock-date {
      font-size: 16px;
      font-weight: 700;
      color: #e0e0e0;
      margin-top: 3px;
    }

    .firebase-ticker-box {
      flex: 1;
      color: #ffff66;
      font-size: 36px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
    }

    .scroll-notice {
      display: inline-block;
      padding-left: 100%;
      animation: scrollNotice 52s linear infinite;
    }

    @keyframes scrollNotice {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-100%); }
    }

    /* 2ND BOTTOM BAR: Static Clinic Information */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 48px;
      line-height: 48px;
      background: rgba(5, 5, 10, 0.95);
      color: #ffffff;
      font-size: 24px;
      overflow: hidden;
      white-space: nowrap;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 5;
    }

    .scroll-footer {
      display: inline-block;
      padding-left: 100%;
      animation: scrollFooter 68s linear infinite;
    }

    @keyframes scrollFooter {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

<!-- Floating Background Bubbles -->
<canvas id="particles"></canvas>

<div class="container">
  <!-- Direct TV autoplay iframe with required muted attribute -->
  <div class="left">
    <iframe id="ytVideo" 
      src="https://www.youtube-nocookie.com/embed/M7lc1UVf-VE?autoplay=1&mute=1&controls=0&loop=1&playlist=M7lc1UVf-VE&enablejsapi=1&cc_load_policy=0&iv_load_policy=3" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      muted="1"
      allowfullscreen>
    </iframe>
  </div>

  <div class="right">
    <img src="logo.png" alt="City Clinic Logo">
    <div class="token-label">Now serving</div>
    <div class="token-number" id="tokenNumber">--</div>
    <div class="token-text">Number</div>
  </div>
</div>

<!-- 1ST BAR: Dynamic Notice (52s) -->
<div class="full-ticker-bar">
  <div class="time-date-box">
    <div class="clock-time" id="dateClock">--:-- --</div>
    <div class="clock-date" id="dateAlt">-- --, ----</div>
  </div>
  <div class="firebase-ticker-box">
    <div class="scroll-notice" id="firebaseNotice"></div>
  </div>
</div>

<!-- 2ND BAR: Clinic Timings (68s) -->
<div class="footer">
  <div class="scroll-footer">
    😄 Welcome to City Clinic – Kanavalli 🏥 • Opened Everyday • Morning 9:30–1:30 • Evening 6:30–10:30 • Stay healthy & safe! 💊
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- High-Visibility Floating Particles -->
<script>
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function createParticles(count) {
    particles = [];
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 4 + 3,
        speedX: (Math.random() - 0.5) * 0.4,
        speedY: (Math.random() - 0.5) * 0.4,
        alpha: Math.random() * 0.4 + 0.2
      });
    }
  }

  function updateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let p of particles) {
      p.x += p.speedX;
      p.y += p.speedY;

      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
      ctx.fill();
    }
    requestAnimationFrame(updateParticles);
  }

  createParticles(120);
  updateParticles();
</script>

<!-- Clock Script -->
<script>
  function updateTime() {
    const now = new Date();
    const time = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    const dateAlt = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    document.getElementById("dateClock").textContent = time;
    document.getElementById("dateAlt").textContent = dateAlt;
  }
  setInterval(updateTime, 1000);
  updateTime();
</script>

<!-- Firebase & Token Player Logic -->
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyC-dN8RtQkDE3eY5q4mQUYiJv9xQCuwnsk",
    authDomain: "cityclinictoken.firebaseapp.com",
    databaseURL: "https://cityclinictoken-default-rtdb.firebaseio.com/",
    projectId: "cityclinictoken",
    storageBucket: "cityclinictoken.appspot.com",
    messagingSenderId: "196394231581",
    appId: "1:196394231581:web:08b59c5f22608a9246d6d5"
  });
  const database = firebase.database();

  const tokenEl = document.getElementById('tokenNumber');
  const firebaseNoticeEl = document.getElementById('firebaseNotice');
  const ytIframe = document.getElementById('ytVideo');
  let lastToken = null, lastUpdate = null;
  let currentLoadedUrl = "";

  // Dynamic Ticker Sync
  database.ref("scrollingNotice").on("value", (snapshot) => {
    const message = snapshot.val();
    if (message !== null && message !== undefined) {
      firebaseNoticeEl.textContent = message;
      firebaseNoticeEl.style.animation = 'none';
      void firebaseNoticeEl.offsetWidth;
      firebaseNoticeEl.style.animation = 'scrollNotice 52s linear infinite';
    }
  });

  // Safe Video Link Parser
  function buildEmbedUrl(url) {
    if (!url) return "";
    let videoId = "", playlistId = "";
    
    try {
      const cleanUrl = url.trim();
      if (!cleanUrl.includes("http") && !cleanUrl.includes("youtube.com") && !cleanUrl.includes("youtu.be")) {
        if (cleanUrl.startsWith("PL")) playlistId = cleanUrl;
        else videoId = cleanUrl;
      } else {
        const u = new URL(cleanUrl);
        const listParam = u.searchParams.get("list");
        const vParam = u.searchParams.get("v");

        if (vParam) videoId = vParam;
        else if (u.hostname.includes("youtu.be")) videoId = u.pathname.replace(/^\/+/, "");
        else if (u.pathname.includes("/shorts/")) videoId = u.pathname.split("/shorts/")[1].split("/")[0];
        else if (u.pathname.includes("/live/")) videoId = u.pathname.split("/live/")[1].split("/")[0];

        if (listParam && listParam.startsWith("PL") && !videoId) playlistId = listParam;
      }
    } catch (e) {
      videoId = url.trim();
    }

    if (playlistId) {
      return `https://www.youtube-nocookie.com/embed/videoseries?list=${playlistId}&autoplay=1&mute=1&controls=0&loop=1&enablejsapi=1&cc_load_policy=0&iv_load_policy=3`;
    }
    if (videoId) {
      return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${videoId}&enablejsapi=1&cc_load_policy=0&iv_load_policy=3`;
    }
    return "";
  }

  // Load URL from Firebase (Excel cell M5)
  database.ref("youtubeURL").on("value", (snapshot) => {
    const url = snapshot.val();
    if (!url || url === currentLoadedUrl) return;
    currentLoadedUrl = url;
    const embedUrl = buildEmbedUrl(url);
    if (embedUrl) {
      ytIframe.src = embedUrl;
    }
  });

  // Remote play/pause control from Excel
  database.ref("videoPlay").on("value", (snapshot) => {
    const playState = snapshot.val();
    if (!ytIframe || !ytIframe.contentWindow) return;
    if (playState === "PAUSE") {
      ytIframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    } else if (playState === "PLAY") {
      ytIframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    }
  });

  // Token Audio Player (Bell + Number MP3)
  function playAnnouncement(token) {
    const numericPart = token.replace(/\D/g, ''); 
    const soundFile = numericPart ? `tokensounds/C${numericPart}.mp3` : `tokensounds/${token}.mp3`;

    const bell = new Audio("bell.mp3");
    const voice = new Audio(soundFile);

    bell.play().then(() => {
      bell.onended = () => {
        voice.play().catch(e => console.warn("Voice error:", e));
      };
    }).catch(() => {
      voice.play().catch(e => console.warn("Voice error:", e));
    });
  }

  // Token update listener
  database.ref('currentToken').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      const newToken = data.token || '--';
      const updatedAt = data.updatedAt || 0;

      if (lastToken !== null && (lastToken !== newToken || lastUpdate !== updatedAt)) {
        playAnnouncement(newToken);

        tokenEl.classList.remove('blink');
        void tokenEl.offsetWidth;
        tokenEl.classList.add('blink');
      }

      lastToken = newToken;
      lastUpdate = updatedAt;
      tokenEl.textContent = newToken;
    }
  });
</script>

</body>
</html>

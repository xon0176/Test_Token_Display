<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>City Clinic Token Display</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(-45deg, #53d0d2, #128f91, #2e3c77, #3e629b);
      background-size: 400% 400%;
      animation: gradientFlow 30s ease infinite;
      z-index: -3;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
    }

    /* Container height minus bottom two ticker bars (92px + 48px = 140px) */
    .container {
      display: flex;
      height: calc(100% - 140px);
      width: 100vw;
    }

    /* Browser audio autoplay prompt */
    #audioNotice {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(231, 76, 60, 0.95);
      color: #ffffff;
      padding: 12px 28px;
      font-size: 22px;
      font-weight: 700;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 100;
      cursor: pointer;
      display: none;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.04); }
    }

    /* LEFT SECTION: Full Height Video */
    .left {
      position: relative;
      width: 68.6%;
      height: 100%;
      background: #000;
      display: flex;
    }

    #ytVideo {
      width: 100%;
      height: 100%;
      border: none; 
      border-bottom-right-radius: 16px;
    }

    /* RIGHT SECTION: Token Display */
    .right {
      width: 31.4%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      padding: 15px 10px;
      box-sizing: border-box;
    }

    .right img {
      width: 290px;
      max-width: 90%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
    }

    .token-label {
      font-size: 58px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .token-number {
      font-size: 260px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 25px #00ffff;
      line-height: 0.95;
      margin: 0;
    }

    .token-number.blink {
      animation: blink 0.6s ease-in-out 3;
    }

    .token-text { 
      font-size: 58px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 1ST BOTTOM BAR: Time/Date + Dynamic Notice */
    .full-ticker-bar {
      position: fixed;
      bottom: 48px;
      left: 0;
      width: 100vw;
      height: 92px;
      display: flex;
      align-items: stretch;
      background: rgba(0, 0, 0, 0.5);
      border-top: 2px solid rgba(255, 255, 255, 0.2);
      z-index: 5;
    }

    .time-date-box {
      width: 12%;
      min-width: 220px;
      background: rgba(10, 15, 25, 0.88);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 2px solid rgba(255, 255, 255, 0.25);
      padding: 0 12px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .clock-time {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.1;
      color: #00f2fe;
      text-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
    }

    .clock-date {
      font-size: 16px;
      font-weight: 700;
      color: #e0e0e0;
      margin-top: 3px;
    }

    .firebase-ticker-box {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      color: #ffff66;
      font-size: 36px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
    }

    /* Notice scrolling speed: 52s (comfortable, readable speed) */
    .scroll-notice {
      display: inline-block;
      padding-left: 100%;
      animation: scrollNotice 52s linear infinite;
    }

    @keyframes scrollNotice {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-100%); }
    }

    /* 2ND BOTTOM BAR: Static Clinic Information */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 48px;
      line-height: 48px;
      background: rgba(0, 0, 0, 0.88);
      color: #ffffff;
      font-size: 24px;
      overflow: hidden;
      white-space: nowrap;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 5;
    }

    /* Clinic timings speed: 68s (relaxed, distinct background speed) */
    .scroll-footer {
      display: inline-block;
      padding-left: 100%;
      animation: scrollFooter 68s linear infinite;
    }

    @keyframes scrollFooter {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

<!-- Autoplay prompt for audio policy unlock -->
<div id="audioNotice">🔊 Click anywhere on screen to enable sound</div>

<!-- Floating Background Particles -->
<canvas id="particles"></canvas>

<div class="container">
  <!-- LEFT: Full Height Video -->
  <div class="left">
    <div id="ytVideo"></div>
  </div>

  <!-- RIGHT: Clinic Logo & Token Display -->
  <div class="right">
    <img src="logo.png" alt="City Clinic Logo">
    <div class="token-label">Now serving</div>
    <div class="token-number" id="tokenNumber">--</div>
    <div class="token-text">Number</div>
  </div>
</div>

<!-- LINE 1: Time/Date + Excel/Firebase Scroller (52s Speed) -->
<div class="full-ticker-bar">
  <div class="time-date-box">
    <div class="clock-time" id="dateClock">--:-- --</div>
    <div class="clock-date" id="dateAlt">-- --, ----</div>
  </div>
  <div class="firebase-ticker-box">
    <div class="scroll-notice" id="firebaseNotice"></div>
  </div>
</div>

<!-- LINE 2: Clinic Timings Ticker (68s Speed) -->
<div class="footer">
  <div class="scroll-footer">
    😄 Welcome to City Clinic – Kanavalli 🏥 • Opened Everyday • Morning 9:30–1:30 • Evening 6:30–10:30 • Stay healthy & safe! 💊
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- Floating Particles -->
<script>
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function createParticles(count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 3 + 4,
        speedX: (Math.random() - 0.5) * 0.5,
        speedY: (Math.random() - 0.5) * 0.5,
      });
    }
  }

  function updateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let p of particles) {
      p.x += p.speedX;
      p.y += p.speedY;

      if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
      if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.fill();
    }
    requestAnimationFrame(updateParticles);
  }

  createParticles(100);
  updateParticles();
</script>

<!-- Clock Script -->
<script>
  function updateTime() {
    const now = new Date();
    const time = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    const dateAlt = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    document.getElementById("dateClock").textContent = time;
    document.getElementById("dateAlt").textContent = dateAlt;
  }
  setInterval(updateTime, 1000);
  updateTime();
</script>

<!-- Main App & Sync Script -->
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyC-dN8RtQkDE3eY5q4mQUYiJv9xQCuwnsk",
    authDomain: "cityclinictoken.firebaseapp.com",
    databaseURL: "https://cityclinictoken-default-rtdb.firebaseio.com/",
    projectId: "cityclinictoken",
    storageBucket: "cityclinictoken.appspot.com",
    messagingSenderId: "196394231581",
    appId: "1:196394231581:web:08b59c5f22608a9246d6d5"
  });
  const database = firebase.database();

  let player = null;
  let playerReady = false;
  const tokenEl = document.getElementById('tokenNumber');
  const firebaseNoticeEl = document.getElementById('firebaseNotice');
  const audioNoticeEl = document.getElementById('audioNotice');
  let lastToken = null, lastUpdate = null;
  let currentLoadedUrl = "";
  let currentContentType = "VIDEO";
  let previousVolume = 35;

  // Realtime Sync for scrollingNotice from Firebase
  database.ref("scrollingNotice").on("value", (snapshot) => {
    const message = snapshot.val();
    if (message !== null && message !== undefined) {
      firebaseNoticeEl.textContent = message;
      firebaseNoticeEl.style.animation = 'none';
      void firebaseNoticeEl.offsetWidth;
      firebaseNoticeEl.style.animation = 'scrollNotice 52s linear infinite';
    }
  });

  // Screen click handler for browser audio unlock
  function enableAudio() {
    audioNoticeEl.style.display = "none";
    if (playerReady && player && player.unMute) {
      database.ref("videoMute").once("value").then(snap => {
        if (snap.val() !== "MUTE") {
          player.unMute();
          player.setVolume(previousVolume);
        }
      });
    }
  }
  document.body.addEventListener("click", enableAudio);
  document.body.addEventListener("touchstart", enableAudio);

  // Safe YouTube link and ID extractor
  function extractYouTubeData(url) {
    let videoId = "", playlistId = "", type = "NONE";
    if (!url) return { type: "NONE" };
    
    try {
      const cleanUrl = url.trim();
      if (!cleanUrl.includes("http") && !cleanUrl.includes("youtube.com") && !cleanUrl.includes("youtu.be")) {
        if (cleanUrl.startsWith("PL")) return { type: "PLAYLIST", playlistId: cleanUrl };
        return { type: "VIDEO", videoId: cleanUrl };
      }

      const u = new URL(cleanUrl);
      const listParam = u.searchParams.get("list");
      const vParam = u.searchParams.get("v");

      if (vParam) {
        videoId = vParam;
      } else if (u.hostname.includes("youtu.be")) {
        videoId = u.pathname.replace(/^\/+/, "");
      } else if (u.pathname.includes("/shorts/")) {
        videoId = u.pathname.split("/shorts/")[1].split("/")[0];
      } else if (u.pathname.includes("/live/")) {
        videoId = u.pathname.split("/live/")[1].split("/")[0];
      }

      if (listParam && listParam.startsWith("PL") && !videoId) {
        playlistId = listParam;
      }
    } catch (e) {
      const cleanUrl = url.trim();
      if (cleanUrl.startsWith("PL")) playlistId = cleanUrl;
      else videoId = cleanUrl;
    }

    if (videoId) return { type: "VIDEO", videoId };
    if (playlistId) return { type: "PLAYLIST", playlistId };
    return { type: "NONE" };
  }

  function disableCaptions() {
    if (!playerReady || !player) return;
    try {
      if (typeof player.unloadModule === "function") {
        player.unloadModule("captions");
        player.unloadModule("cc");
      }
    } catch (e) {}
  }

  function loadContentIntoPlayer(yt) {
    if (!playerReady || !player) return;
    currentContentType = yt.type;
    if (yt.type === "PLAYLIST") {
      player.setLoop(true);
      player.loadPlaylist({ listType: "playlist", list: yt.playlistId, index: 0 });
    } else if (yt.type === "VIDEO") {
      player.setLoop(true);
      player.loadVideoById({ videoId: yt.videoId });
    }
    disableCaptions();
  }

  // Safe YouTube Player Initialization
  function initYouTubePlayer() {
    if (player) return;
    player = new YT.Player("ytVideo", {
      width: "100%",
      height: "100%",
      videoId: "M7lc1UVf-VE",
      playerVars: {
        autoplay: 1,
        controls: 0,
        mute: 1, // Start muted so browsers unconditionally allow autoplay
        rel: 0,
        modestbranding: 1,
        playsinline: 1,
        loop: 1,
        cc_load_policy: 0,
        iv_load_policy: 3
      },
      events: {
        onReady: function () {
          playerReady = true;
          disableCaptions();

          // Sync mute status with Firebase
          database.ref("videoMute").once("value").then((snap) => {
            const muteState = snap.val();
            if (muteState !== "MUTE") {
              player.unMute();
              player.setVolume(previousVolume);

              setTimeout(() => {
                if (player.isMuted && player.isMuted()) {
                  audioNoticeEl.style.display = "block";
                }
              }, 1200);
            }
          });

          // Load latest YouTube link from Firebase
          database.ref("youtubeURL").once("value").then((snapshot) => {
            const url = snapshot.val();
            if (url) {
              currentLoadedUrl = url;
              const yt = extractYouTubeData(url);
              if (yt.type !== "NONE") {
                loadContentIntoPlayer(yt);
              }
            }
          });
        },
        onStateChange: function (event) {
          disableCaptions();
          if (event.data === YT.PlayerState.ENDED) {
            if (currentContentType === "PLAYLIST") player.playVideoAt(0);
            else player.playVideo();
          }
        }
      }
    });

    database.ref("youtubeURL").on("value", (snapshot) => {
      const url = snapshot.val();
      if (!url || url === currentLoadedUrl) return;
      currentLoadedUrl = url;
      const yt = extractYouTubeData(url);
      if (playerReady && yt.type !== "NONE") loadContentIntoPlayer(yt);
    });
  }

  // Prevents YouTube API race conditions when loaded from cache
  if (window.YT && window.YT.Player) {
    initYouTubePlayer();
  } else {
    window.onYouTubeIframeAPIReady = initYouTubePlayer;
  }

  // Firebase Realtime Video Control Listeners
  database.ref("videoMute").on("value", (snapshot) => {
    const muteState = snapshot.val();
    if (playerReady && player && player.mute) {
      if (muteState === "MUTE") {
        player.mute();
      } else {
        player.unMute();
        player.setVolume(previousVolume);
        audioNoticeEl.style.display = "none";
      }
    }
  });

  database.ref("videoPlay").on("value", (snapshot) => {
    const playState = snapshot.val();
    if (playerReady && player && player.playVideo) {
      if (playState === "PLAY") player.playVideo();
      else if (playState === "PAUSE") player.pauseVideo();
    }
  });

  database.ref("videoVolume").on("value", (snapshot) => {
    const vol = parseInt(snapshot.val(), 10);
    if (!isNaN(vol) && vol >= 0 && vol <= 100) {
      previousVolume = vol;
      if (playerReady && player && player.setVolume) {
        player.setVolume(vol);
      }
    }
  });

  // Announcement Player Helper Function (Extracts numeric digits and plays C{number}.mp3)
  function playAnnouncement(token) {
    if (playerReady && player && player.getVolume && player.setVolume) {
      const vol = player.getVolume();
      if (vol > 10) previousVolume = vol;
      player.setVolume(5);
    }

    const numericPart = token.replace(/\D/g, ''); 
    const soundFile = numericPart ? `tokensounds/C${numericPart}.mp3` : `tokensounds/${token}.mp3`;

    const bell = new Audio("bell.mp3");
    const voice = new Audio(soundFile);

    bell.play().then(() => {
      bell.onended = () => {
        voice.play().catch(e => console.warn("Voice play error:", e));
      };
    }).catch(() => {
      voice.play().catch(e => console.warn("Voice play error:", e));
    });

    setTimeout(() => {
      if (playerReady && player && player.setVolume) {
        player.setVolume(previousVolume);
      }
    }, 6000);
  }

  // Token Announcement Listener
  database.ref('currentToken').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      const newToken = data.token || '--';
      const updatedAt = data.updatedAt || 0;

      if (lastToken !== null && (lastToken !== newToken || lastUpdate !== updatedAt)) {
        playAnnouncement(newToken);

        tokenEl.classList.remove('blink');
        void tokenEl.offsetWidth;
        tokenEl.classList.add('blink');
      }

      lastToken = newToken;
      lastUpdate = updatedAt;
      tokenEl.textContent = newToken;
    }
  });
</script>

<!-- Asynchronous YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
